<script>
/* HR Soul AI Policy Development: policy engine.
 * Turns content.json + the user's answers into a policy model, then into HTML or a Word document.
 * Works in the browser (window.PolicyEngine) and in Node (require).
 */
(function (root) {
  "use strict";

  // ---------- state ----------
  function defaultAnswer(q) {
    if (q.type === "yesno") return q.default;
    if (q.type === "checklist") { var o = {}; q.options.forEach(function (x) { o[x.id] = x.default; }); return o; }
    if (q.type === "interval") return { n: q.default.n, unit: q.default.unit };
    if (q.type === "depts") return null; // null = same as Policy Details
    return q.default || "";
  }
  function defaultWho(q) { var sel = {}; (q.contact.default || []).forEach(function (k) { sel[k] = true; }); return { sel: sel, other: "" }; }
  function defaultState(content) {
    var s = {
      details: {}, people: {}, covers: {}, custom_fields: [], logo: null,
      include: {}, answers: {}, custom: {}, visited: {}, ack: content.ack_default || "understand"
    };
    content.details.forEach(function (d) {
      if (d.type === "person") s.details[d.id] = { mode: "role", name: "", role: "" };
      else s.details[d.id] = "";
    });
    s.details.draft_date = new Date().toISOString().slice(0, 10);
    content.people.forEach(function (p) { s.people[p.token] = { mode: "role", name: "", role: p.default_role, enabled: true }; });
    s.details.depts = { hr: true }; s.details.dept_other = "";
    content.covers.forEach(function (c) { s.covers[c.id] = c.default; });
    content.sections.forEach(function (sec) {
      s.include[sec.id] = sec.core ? true : null; // null = not chosen yet
      var a = {};
      sec.items.forEach(function (q) {
        a[q.id] = defaultAnswer(q);
        if (q.contact) a[q.id + "__who"] = defaultWho(q);
        if (q.other) a[q.id + "__other"] = "";
      });
      if (sec.closing_contact) a.__closing__who = defaultWho({ contact: sec.closing_contact });
      s.answers[sec.id] = a;
      s.custom[sec.id] = "";
    });
    return s;
  }
  // fill in anything a newer content version added (keeps old saved progress working)
  function upgradeState(content, s) {
    var d = defaultState(content);
    var oldDept = s.details && typeof s.details.dept === "string" ? s.details.dept.trim() : "";
    ["details", "people", "covers"].forEach(function (k) { s[k] = Object.assign({}, d[k], s[k] || {}); });
    if (oldDept && !(s.details.depts && Object.keys(s.details.depts).some(function (k) { return s.details.depts[k] && k !== "hr"; }))) { s.details.depts = { other: true }; s.details.dept_other = oldDept; }
    content.people.forEach(function (p) { s.people[p.token] = Object.assign({}, d.people[p.token], s.people[p.token] || {}); if (s.people[p.token].enabled == null) s.people[p.token].enabled = d.people[p.token].enabled; });
    if (!s.visited) s.visited = {};
    if (!s.ack) s.ack = d.ack;
    s.answers = s.answers || {}; s.custom = s.custom || {}; s.include = s.include || {};
    content.sections.forEach(function (sec) {
      if (!(sec.id in s.include)) s.include[sec.id] = d.include[sec.id];
      s.answers[sec.id] = Object.assign({}, d.answers[sec.id], s.answers[sec.id] || {});
      if (s.custom[sec.id] == null) s.custom[sec.id] = "";
    });
    return s;
  }

  // ---------- tokens ----------
  function person(p) {
    if (!p) return "";
    var name = (p.name || "").trim(), role = (p.role || "").trim();
    if (p.mode === "name" && name) return role ? name + " (" + role + ")" : name;
    return role || name;
  }
  function deptNames(content, sel, other) {
    var out = [];
    (content.departments || []).forEach(function (x) {
      if (!sel || !sel[x.id]) return;
      if (x.id === "other") { if ((other || "").trim()) out.push(other.trim()); }
      else out.push(x.label);
    });
    return out;
  }
  function tokens(state) {
    var d = state.details, t = {};
    t.company = (d.company || "").trim() || "the Company";
    var dn = deptNames(root.__C || { departments: [] }, d.depts, d.dept_other);
    t.dept = dn.length ? joinList(dn) : ((d.dept || "").trim() || "Human Resources");
    t.owner = person(d.owner) || "the policy owner";
    t.owner_email = (d.owner_email || "").trim();
    t.approver = person(d.approver) || "leadership";
    Object.keys(state.people).forEach(function (k) { var p = state.people[k]; t[k] = p.enabled === false ? "" : person(p); });
    if (!t.gov) t.gov = t.owner;
    t.manager = "your manager";
    return t;
  }
  function joinList(items, word) {
    word = word || "and";
    if (items.length <= 1) return items[0] || "";
    if (items.length === 2) return items[0] + " " + word + " " + items[1];
    return items.slice(0, -1).join(", ") + ", " + word + " " + items[items.length - 1];
  }
  // who the user picked for a question's {contact}
  function contactText(content, a, q, t) {
    var w = a[q.id + "__who"] || defaultWho(q), names = [];
    content.contacts.forEach(function (c) {
      if (!w.sel || !w.sel[c.token]) return;
      if (c.token === "other") { var o = (w.other || "").trim(); if (o) names.push(o); }
      else if (t[c.token] && names.indexOf(t[c.token]) === -1) names.push(t[c.token]);
    });
    if (!names.length) (q.contact.default || []).forEach(function (k) { if (t[k]) names.push(t[k]); });
    return joinList(names, "or");
  }
  function fill(str, t, value, contact) {
    return String(str || "").replace(/\{(\w+)\}/g, function (m, k) {
      if (k === "value") return value == null ? "" : value;
      if (k === "contact") return contact == null ? m : contact;
      return t[k] != null ? t[k] : m;
    });
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function tidy(s) { return cap(String(s).trim()).replace(/([.!?]\s+)([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); }).replace(/s's\b/g, "s'"); }

  // is this question asked, given the other answers in its section?
  function isShown(q, a) {
    var c = q.show_if;
    if (!c) return true;
    if (typeof c === "string") {
      var dep = q.__sec && q.__sec.items.filter(function (x) { return x.id === c; })[0];
      if (dep && !isShown(dep, a)) return false;
      return !!a[c];
    }
    return (c.in || []).indexOf(a[c.q]) !== -1;
  }
  function linkSections(content) {
    content.sections.forEach(function (sec) { sec.items.forEach(function (q) { q.__sec = sec; }); });
  }
  function valueOf(q, a, t) {
    var v = a[q.id];
    if (q.type === "select") return v === "Other" ? (a[q.id + "__other"] || "").trim() : (v || "");
    if (q.type === "interval") {
      if (!v || !v.n) return "";
      var n = +v.n, unit = v.unit || "months";
      return n === 1 ? "1 " + unit.replace(/s$/, "") : n + " " + unit;
    }
    var s = (v || "").toString().trim();
    if (!s && q.default_token) s = t[q.default_token] || "";
    return s;
  }

  // ---------- model ----------
  function splitItems(v) { return String(v || "").split(/[\n,;]+/).map(function (x) { return x.trim(); }).filter(Boolean); }
  function sectionBlocks(content, sec, state, t) {
    var a = state.answers[sec.id] || {}, blocks = [], list = null, atEnd = [];
    function F(txt, q, val) { return fill(txt, t, val, q && q.contact ? contactText(content, a, q, t) : null); }
    function para(txt) { list = null; blocks.push({ type: "p", text: tidy(txt) }); }
    function bullet(txt) {
      if (!list) { list = { type: "list", lead: null, items: [] }; blocks.push(list); }
      list.items.push(tidy(txt));
    }
    para(fill(sec.intro, t));
    if (sec.id === "purpose") {
      var covers = content.covers.filter(function (c) { return state.covers[c.id]; });
      if (covers.length) { blocks.push({ type: "list", lead: "This policy applies to:", items: covers.map(function (c) { return tidy(fill(c.text, t)); }) }); list = null; }
    }
    sec.items.forEach(function (q) {
      if (!isShown(q, a)) return;
      var v = a[q.id];
      var joinsList = (q.type === "text" && q.template === "{value}");
      if (list && list._fromChecklist && !joinsList) list = null;
      if (q.type === "yesno") {
        var txt = v ? q.text_yes : q.text_no;
        if (!txt) return;
        // a yes/no whose sentence uses {value} pulls the value from the next question (e.g. which department)
        var nextQ = sec.items[sec.items.indexOf(q) + 1];
        var val = (txt.indexOf("{value}") !== -1 && nextQ) ? valueOf(nextQ, a, t) : null;
        var out = F(txt, q, val);
        if (q.para) para(out); else bullet(out);
      } else if (q.type === "checklist") {
        var picked = q.options.filter(function (o) { return v && v[o.id]; });
        if (q.join) {
          if (picked.length) {

  function whoPicker(sec, q) {
    var a = S.answers[sec.id], key = q.id + "__who", w = a[key];
    if (!w) { w = a[key] = { sel: {}, other: "" }; (q.contact.default || []).forEach(function (k) { w.sel[k] = true; }); }
    var t = tok(), base = "answers." + sec.id + "." + key;
    var chips = C.contacts.filter(function (c) {
      if (c.token === "gov") return S.people.gov.enabled !== false;
      if (c.token === "other_contact") return !!E.person(S.people.other_contact);
      return true;
    }).map(function (c) {
      var on = !!w.sel[c.token], name = c.token === "other" ? "" : (t[c.token] || "");
      return '<label class="chip' + (on ? " on" : "") + '"><input type="checkbox" data-who="' + base + ".sel." + c.token + '"' + (on ? " checked" : "") + '><span><b>' + h(c.label) + "</b>" + (name && c.token !== "manager" ? '<span class="chip-sub">' + h(name) + "</span>" : "") + "</span></label>";
    }).join("");

      '<p class="hint">These come from the people you named on Policy Details. Change them there, or pick someone else just for this question.</p></div>';
  }
  function previewText(sec, q, txt, val) {
    var a = sec ? S.answers[sec.id] : {}, t = tok();
    var contact = q.contact ? E.contactText(C, a, q, t) : null;
    var out = String(txt || "").replace(/\{(\w+)\}/g, function (m, k) {
      if (k === "value") return val == null ? "[your answer]" : val;
      if (k === "contact") return contact || m;
      return t[k] != null ? t[k] : m;
    });
    return h(out).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }
  function addsBox(label, html) { return '<p class="adds"><b>' + label + "</b>" + html + "</p>"; }

  function questionHTML(sec, q) {
    var a = S.answers[sec.id];
    if (!E.isShown(q, a)) return "";
    var v = a[q.id], base = "answers." + sec.id + "." + q.id, qid = "q-" + sec.id + "-" + q.id;
    var out = '<div class="q' + (q.show_if ? " followup" : "") + '">';
    out += '<p class="q-title" id="' + qid + '">' + h(q.prompt) + "</p>";
    if (q.help) out += '<p class="q-help">' + h(q.help) + "</p>";
    var usesContact = false;
    if (q.type === "yesno") {
      out += '<div class="opts row" role="radiogroup" aria-labelledby="' + qid + '">' +
        '<label class="optrow' + (v ? " on" : "") + '"><input type="radio" name="' + base + '" data-yn="' + base + '" value="1"' + (v ? " checked" : "") + "><span>Yes</span></label>" +
        '<label class="optrow' + (!v ? " on" : "") + '"><input type="radio" name="' + base + '" data-yn="' + base + '" value="0"' + (!v ? " checked" : "") + "><span>No</span></label></div>";
      var txt = v ? q.text_yes : q.text_no;
      var hasFollow = sec.items.some(function (x) { return x.show_if === q.id; });
      if (txt) {
        var nextQ = sec.items[sec.items.indexOf(q) + 1], val = null;
        if (txt.indexOf("{value}") !== -1 && nextQ) { val = (a[nextQ.id] || "").trim() || tok()[nextQ.default_token] || ""; }
        out += addsBox("Adds", previewText(sec, q, txt, val));
        usesContact = q.contact && txt.indexOf("{contact}") !== -1;
      } else if (!hasFollow || !v) out += addsBox("Adds", "Nothing. This point is left out of the policy.");
    } else if (q.type === "checklist") {
      out += '<div class="opts">' + q.options.map(function (o) {
        var on = !!(v && v[o.id]);
        return '<label class="optrow' + (on ? " on" : "") + '"><input type="checkbox" data-bind="' + base + "." + o.id + '"' + (on ? " checked" : "") + "><span>" + richT(o.text) + "</span></label>";
      }).join("") + "</div>";
    } else if (q.type === "select") {
      var opts = q.options.concat(q.other ? ["Other"] : []);
      out += '<select id="' + base.replace(/\./g, "-") + '" data-bind="' + base + '" aria-labelledby="' + qid + '">' + opts.map(function (o) { return "<option" + (o === v ? " selected" : "") + ">" + h(o) + "</option>"; }).join("") + "</select>";
      if (v === "Other") out += '<input type="text" id="' + base.replace(/\./g, "-") + '-other" data-bind="' + base + '__other" value="' + h(a[q.id + "__other"]) + '" placeholder="Type your own" aria-label="Other">';
      var sv = v === "Other" ? (a[q.id + "__other"] || "").trim() : v;
      if (q.option_text && q.option_text[v]) out += addsBox("Adds", previewText(sec, q, q.option_text[v]));
      else if (q.template) out += addsBox("Adds", previewText(sec, q, q.template, sv || null));
      usesContact = q.contact && q.template && q.template.indexOf("{contact}") !== -1;
    } else if (q.type === "interval") {
      out += '<div class="interval"><input type="number" min="1" max="60" id="' + base.replace(/\./g, "-") + '-n" data-bind="' + base + '.n" value="' + h(v.n) + '" aria-label="Number"><select id="' + base.replace(/\./g, "-") + '-unit" data-bind="' + base + '.unit" aria-label="Months or years">' +
        q.units.map(function (u) { return "<option" + (u === v.unit ? " selected" : "") + ">" + u + "</option>"; }).join("") + "</select></div>";
      out += addsBox("Adds", previewText(sec, q, q.template, (v.n || "…") + " " + (+v.n === 1 ? v.unit.replace(/s$/, "") : v.unit)));
    } else if (q.type === "depts") {
      var cur = v || { sel: Object.assign({}, S.details.depts), other: S.details.dept_other };
      out += '<div class="chips">' + C.departments.map(function (x) {
        var on = !!cur.sel[x.id];
        return '<label class="chip' + (on ? " on" : "") + '"><input type="checkbox" data-dept="' + base + '" data-id="' + x.id + '"' + (on ? " checked" : "") + "><span><b>" + h(x.label) + "</b></span></label>";
      }).join("") + "</div>";
      if (cur.sel.other) out += '<input type="text" data-deptother="' + base + '" value="' + h(cur.other) + '" placeholder="Department name" aria-label="Other department" style="max-width:420px">';
      var dn = E.deptNames(C, cur.sel, cur.other);
      if (dn.length) out += addsBox("Adds", previewText(sec, q, dn.length > 1 ? q.template_many : q.template_one, E.joinList(dn)));
    } else if (q.type === "textlist") {
      out += '<textarea id="' + base.replace(/\./g, "-") + '" data-bind="' + base + '" placeholder="' + h(q.placeholder || "") + '" aria-labelledby="' + qid + '" rows="3">' + h(v) + "</textarea>";
      out += '<p class="hint">Prints under: “' + h(q.lead) + '”</p>';
    } else {
      var ph = q.placeholder || (q.default_token ? tok()[q.default_token] : "");
      out += '<input type="text" id="' + base.replace(/\./g, "-") + '" data-bind="' + base + '" value="' + h(v) + '" placeholder="' + h(ph) + '" aria-labelledby="' + qid + '">';
      if (q.template && q.template !== "{value}") out += '<p class="hint">Prints as: ' + previewText(sec, q, q.template, null) + "</p>";
      usesContact = !!q.contact;
    }
    if (usesContact) out += whoPicker(sec, q);
    return out + "</div>";
  }

  R.build = function () {
    var pages = buildPages();

        navBar({ back: nav.returnTo ? null : "Back", next: nextLabel });

  }
  function navBar(o) {
    return '<div class="nav">' + (o.back ? '<button type="button" class="btn" id="back">← ' + h(o.back) + "</button>" : "<span></span>") +
      (o.msg ? '<span class="msg" id="navMsg">' + h(o.msg) + "</span>" : '<span class="msg" id="navMsg"></span>') +
      (o.next ? '<button type="button" class="btn primary" id="next"' + (o.disabled ? " disabled" : "") + ">" + h(o.next) + " →</button>" : "") + "</div>";
  }

  // ---------- render ----------
  function render(scrollTop) {
    renderTop();
    var main = $("#main");
    main.innerHTML = '<div class="col' + (nav.step === "review" ? " wide" : "") + '">' + R[nav.step]() + "</div>";
    if (scrollTop !== false) window.scrollTo(0, 0);
    save();
  }
  function go(step, opts) { nav.step = step; if (opts) Object.assign(nav, opts); render(); }

  // ---------- validation ----------
  function detailsMissing() {
    var miss = [];
    var d = S.details;
    if (!d.company.trim()) miss.push("company name");
    if (!d.preparer.trim()) miss.push("your name");
    var dn = E.deptNames(C, d.depts, d.dept_other);
    if (!dn.length) miss.push("who carries out and enforces the policy");
    C.people.forEach(function (p) {
      if (!p.required) return;
      var pp = S.people[p.token];
      if (!((pp.mode === "name" ? pp.name : pp.role) || "").trim()) miss.push(p.label);
    });
    if (!((d.owner.mode === "name" ? d.owner.name : d.owner.role) || "").trim()) miss.push("who handles revisions");
    if (!((d.approver.mode === "name" ? d.approver.name : d.approver.role) || "").trim()) miss.push("final approval");
    if (!d.draft_date) miss.push("draft date");
    return miss;
  }

  // ---------- navigation ----------
  function next() {
    var st = nav.step;
    if (st === "details") {
      var miss = detailsMissing();
      if (miss.length) { $("#navMsg").textContent = "Please fill in: " + miss.join(", ") + "."; return; }
      S.reachedInclude = true;
      go("include");
    } else if (st === "include") { nav.sec = null; go("build", { returnTo: null }); }
    else if (st === "build") {
      if (nav.returnTo) { var r = nav.returnTo; nav.returnTo = null; go(r); return; }
      var pages = buildPages(), idx = pages.indexOf(nav.sec);
      if (idx < pages.length - 1) { nav.sec = pages[idx + 1]; render(); } else go("finish");
    } else if (st === "finish") go("review");
    else if (st === "review") go("download");
  }
  function back() {
    var st = nav.step;
    if (st === "details") go("welcome");
    else if (st === "include") go("details");
    else if (st === "build") {
      var pages = buildPages(), idx = pages.indexOf(nav.sec);
      if (idx > 0) { nav.sec = pages[idx - 1]; render(); } else go("include");
    } else if (st === "finish") { nav.sec = "ack"; go("build", { returnTo: null }); }
    else if (st === "review") go("finish");
    else if (st === "download") go("review");
  }

  // ---------- events ----------
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("button, a, [data-edit]");
    if (!t) return;
    var id = t.id;
    if (id === "go") return startNew();
    if (id === "resume") return resume();
    if (id === "startFresh") { clearSaved(); fresh(); render(); return; }
    if (id === "next") return next();
    if (id === "back") return back();
    if (id === "addField") { S.custom_fields.push({ label: "", value: "" }); render(false); var f = document.getElementById("cf-l-" + (S.custom_fields.length - 1)); if (f) f.focus(); return; }
    if (id === "logoRemove") { S.logo = null; render(false); return; }
    if (id === "allYes" || id === "allNo") { C.sections.forEach(function (s) { if (!s.core) S.include[s.id] = id === "allYes"; }); render(false); return; }
    if (id === "dl") return download();
    if (id === "seeProgress") return showProgress();
    if (id === "startOver") return confirmStartOver();
    if (id === "pvReset") { fresh(); render(); return; }
    if (t.dataset.goto) { jumpTo(t.dataset.goto); return; }
    if (t.dataset.gov) { S.people.gov.enabled = t.dataset.gov === "1"; render(false); return; }
    if (t.dataset.mode) { var wrap = t.closest("[data-person]"); setPath(wrap.dataset.person + ".mode", t.dataset.mode); render(false); return; }
    if (t.dataset.inc) { S.include[t.dataset.inc] = t.dataset.v === "1"; render(false); return; }
    if (t.dataset.add) { S.include[t.dataset.add] = true; nav.sec = t.dataset.add; go("build", { returnTo: "finish" }); return; }
    var edit = ev.target.closest("[data-edit]");
    if (edit) { ev.preventDefault(); closeModal(); nav.sec = edit.dataset.edit; go("build", { returnTo: "review" }); return; }
    if (t.dataset.jump) { ev.preventDefault(); var el = document.getElementById("pol-" + t.dataset.jump); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (t.dataset.close != null) { closeModal(); return; }
  });

  document.addEventListener("input", function (ev) {
    var el = ev.target, b = el.dataset && el.dataset.bind;
    if (!b || el.type === "checkbox" || el.type === "radio" || el.type === "file") return;
    setPath(b, el.value);
    if (nav.step === "details" && $("#navMsg")) $("#navMsg").textContent = "";
    save();
  });
  function jumpTo(v) {
    closeModal(); nav.returnTo = null;
    if (v.indexOf("sec:") === 0) { nav.sec = v.slice(4); go("build"); return; }
    if (v === "build") { nav.sec = buildPages()[0]; }
    go(v);
  }
  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.id === "jump") { jumpTo(el.value); return; }
    if (el.id === "logo" && el.files && el.files[0]) return readLogo(el.files[0]);
    if (el.dataset.yn) { setPath(el.dataset.yn, el.value === "1"); render(false); return; }
    if (el.dataset.ack) { S.ack = el.dataset.ack; render(false); return; }
    if (el.dataset.who) { setPath(el.dataset.who, el.checked); render(false); return; }
    if (el.dataset.dept) {
      var cur = getPath(el.dataset.dept) || { sel: Object.assign({}, S.details.depts), other: S.details.dept_other };
      cur.sel[el.dataset.id] = el.checked; setPath(el.dataset.dept, cur); render(false); return;
    }
    if (el.dataset.deptother) { var c2 = getPath(el.dataset.deptother) || { sel: Object.assign({}, S.details.depts), other: "" }; c2.other = el.value; setPath(el.dataset.deptother, c2); save(); return; }
    if (el.dataset.bind && el.type === "checkbox") {
      setPath(el.dataset.bind, el.checked);
      if (/\.depts\.|__closing|\.sel\./.test(el.dataset.bind) || el.closest(".chip")) { render(false); return; }
      var row = el.closest(".optrow"); if (row) row.classList.toggle("on", el.checked); save(); return;
    }
    if (el.dataset.bind && el.tagName === "SELECT") { setPath(el.dataset.bind, el.value); render(false); return; }
    if (el.dataset.bind && el.type === "number") { setPath(el.dataset.bind, el.value); render(false); return; }
  });

  function readLogo(file) {
    if (!/^image\/(png|jpeg)$/.test(file.type)) { $("#navMsg").textContent = "Please choose a PNG or JPG file."; return; }
    if (file.size > 3 * 1024 * 1024) { $("#navMsg").textContent = "That logo is over 3 MB. Please choose a smaller file."; return; }
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () { S.logo = { dataUrl: r.result, width: img.naturalWidth, height: img.naturalHeight, type: file.type === "image/png" ? "png" : "jpg" }; render(false); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  function resume() {
    var doIt = function () { S = E.upgradeState(C, saved.state); nav = saved.nav; nav.step = nav.step === "welcome" ? "details" : nav.step; render(); };
    if (!CFG.passcodesRequired || PREVIEW) return doIt();
    var code = saved.state.code, msg = $("#codeMsg");
    if (!code) { msg.textContent = "Please enter your access code to continue."; return; }
    msg.textContent = "Checking your access code…";
    checkCode(code).then(function (r) {
      if (r.valid) doIt();
      else msg.textContent = r.message || "That access code is no longer active. Contact HR Soul if you need more time.";
    }).catch(function () { msg.textContent = "We couldn't check your code right now. Please try again in a minute."; });
  }

  function startNew() {
    if (CFG.passcodesRequired) {
      var code = ($("#code").value || "").trim().toLowerCase();
      if (!code) { $("#codeMsg").textContent = "Please enter your access code."; return; }
      $("#codeMsg").textContent = "Checking your code…";
      checkCode(code).then(function (r) {
        if (r.valid) { clearSaved(); fresh(); S.code = code; LAST_CODE = code; go("details"); }
        else $("#codeMsg").textContent = r.message || "That code isn't active. Check the code or contact HR Soul for a new one.";
      }).catch(function () { $("#codeMsg").textContent = "We couldn't check your code right now. Please try again in a minute."; });
      return;
    }
    if (PREVIEW) { go("details"); return; }
    clearSaved(); fresh(); go("details");
  }

  // backend hooks (Google Apps Script), used once passcodes are switched on
  function checkCode(code) {
    return fetch(CFG.appsScriptUrl + "?action=check&code=" + encodeURIComponent(code)).then(function (r) { return r.json(); });
  }
  function logEvent(code, event) {
    if (!CFG.appsScriptUrl || !code) return;
    try { fetch(CFG.appsScriptUrl + "?action=log&code=" + encodeURIComponent(code) + "&event=" + encodeURIComponent(event)); } catch (e) { }
  }

  // ---------- modals ----------
  function modal(html, cls) {
    closeModal();
    var d = document.createElement("div");
    d.className = "scrim"; d.id = "scrim";
    d.innerHTML = '<div class="modal ' + (cls || "") + '" role="dialog" aria-modal="true">' + html + "</div>";
    d.addEventListener("click", function (e) { if (e.target === d) closeModal(); });
    document.body.appendChild(d);
    var f = d.querySelector("[data-autofocus]") || d.querySelector("button"); if (f) f.focus();
  }
  function closeModal() { var s = $("#scrim"); if (s) s.remove(); }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  function showProgress() {
    var done = {}, pages = buildPages();
    included().forEach(function (sec) { if (S.visited[sec.id]) done[sec.id] = true; });
    var m = E.buildModel(C, S, { only: done });
    var remaining = pages.filter(function (id) { return !S.visited[id]; });
    var doneCount = pages.length - remaining.length;
    var todo = remaining.length ? '<div class="todo"><b>Still to do (' + remaining.length + ')</b><ol>' + remaining.map(function (id) { return "<li>" + h(pageTitle(id)) + "</li>"; }).join("") + "</ol></div>" :
      '<div class="todo"><b>You\'ve been through every section.</b> Head to Review Draft to see the full policy.</div>';
    var body = doneCount ? '<article class="paper">' + E.toHTML(m, { noAck: !S.visited.ack }) + "</article>" : '<p>You haven\'t built any sections yet. Your draft will appear here as you go.</p>';
    modal('<div class="modal-head"><h2>My progress</h2><button class="x" data-close aria-label="Close">×</button></div>' +
      '<div class="modal-body"><p>' + doneCount + " of " + pages.length + " Build the Policy pages done. Here's your draft so far.</p>" + todo + body + "</div>" +
      '<div class="modal-foot"><button class="btn primary" data-close data-autofocus>Back to where I was</button></div>');
  }
  function confirmStartOver() {
    modal('<div class="modal-head"><h2>Start over?</h2><button class="x" data-close aria-label="Close">×</button></div>' +
      '<div class="modal-body"><p>This clears every answer and your saved progress in this browser. You can\'t undo it.</p></div>' +
      '<div class="modal-foot"><button class="btn" data-close data-autofocus>Keep my answers</button><button class="btn primary" id="confirmReset">Yes, start over</button></div>', "small");
    $("#confirmReset").addEventListener("click", function () { clearSaved(); fresh(); closeModal(); render(); });
  }
  function congrats() {
    var t = C.text, link = CFG.reviewLink, emailNote = "";
    if (CFG.reviewEmail) {
      // pre-filled email to HR Soul; the address also shows as text in case the mail app doesn't open
      var subj = "AI policy review request" + (S.details.company ? " - " + S.details.company : "");
      var body = "Hi HR Soul,\n\nI've finished my AI policy draft with the AI Policy Development tool and I'd like to schedule the $250 policy review.\n\n" +
        "Company: " + (S.details.company || "") + "\nName: " + (S.details.preparer || "") + (S.code ? "\nAccess code: " + S.code : "") + "\n\nThanks!";
      link = "mailto:" + CFG.reviewEmail + "?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(body);
      emailNote = '<p class="hint">Or email us directly at <b>' + h(CFG.reviewEmail) + "</b>.</p>";
    }
    modal('<div class="modal-head"><h2>Draft downloaded</h2><button class="x" data-close aria-label="Close">×</button></div>' +
      '<div class="modal-body"><div class="congrats-top"><div class="big">' + h(t.congrats_title) + "</div><p>" + h(t.congrats_body) + "</p></div>" +
      '<div class="offer"><div class="price">' + h(CFG.reviewPrice) + ' <span style="font-size:15px;font-weight:600;color:var(--ink-2)">policy review with HR Soul</span></div>' +
      (link ? '<a class="btn primary" style="text-align:center;text-decoration:none" href="' + h(link) + '" target="_blank" rel="noopener">' + h(t.congrats_cta) + "</a>" + emailNote :
        '<button class="btn primary" type="button" disabled title="Link coming soon">' + h(t.congrats_cta) + '</button><p class="hint">Booking link coming soon.</p>') + "</div>" +
      '<div class="freebie"><b>' + h(t.freebie_title) + "</b><p>" + h(t.freebie_body) + '</p><button class="btn" type="button" id="freebie" style="align-self:flex-start">' + h(t.freebie_cta) + '</button><p class="status" id="freeMsg" role="status"></p></div>' +
      '<p class="hint">Your answers are still saved in this browser so you can come back and add sections. Done for good?</p></div>' +
      '<div class="modal-foot"><button class="btn" type="button" id="clearAll">Clear my answers from this browser</button><button class="btn primary" data-close data-autofocus>Close</button></div>');
    $("#freebie").addEventListener("click", getFreebie);
    $("#clearAll").addEventListener("click", function () { clearSaved(); fresh(); closeModal(); render(); });
  }

  // ---------- files ----------
  function b64ToBytes(dataUrl) { var b = atob(dataUrl.split(",")[1]), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function saveFile(blob, filename) {
    // Inside claude.ai the page must ask the viewer to save; on a normal website a plain download works.
    var viaClaude = window.claude && window.claude.use ? window.claude.use("downloads").catch(function () { return null; }) : Promise.resolve(null);
    return viaClaude.then(function (dl) {
      if (dl) return dl.save({ filename: filename, data: blob }).then(function () { return "saved"; });
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return "saved";
    });
  }
  function download() {
    var msg = $("#dlMsg"), btn = $("#dl");
    btn.disabled = true; msg.textContent = "Building your Word document…";
    try {
      var m = E.buildModel(C, S), opts = { hrLogo: b64ToBytes(C.assets.hrLogo), generatedOn: E.fmtDate(new Date().toISOString().slice(0, 10)) };
      if (S.logo) opts.companyLogo = { data: b64ToBytes(S.logo.dataUrl), type: S.logo.type, width: S.logo.width, height: S.logo.height };
      var doc = E.toDocx(window.docx, m, opts);
      var name = (S.details.company || "My Company").replace(/[^\w\- ]+/g, "").trim() + " - AI Policy DRAFT.docx";
      window.docx.Packer.toBlob(doc).then(function (blob) { return saveFile(blob, name); }).then(function () {
        btn.disabled = false; msg.textContent = "Downloaded. Check your downloads folder.";
        logEvent(S.code, "draft_downloaded");
        congrats();
      }).catch(function (e) {
        btn.disabled = false;
        msg.textContent = e && e.code === "declined" ? "Download cancelled. Click the button to try again." : "Something went wrong building the file. Please try again.";
        if (!(e && e.code === "declined")) console.error(e);
      });
    } catch (e) { btn.disabled = false; msg.textContent = "Something went wrong building the file. Please try again."; console.error(e); }
  }
  function getFreebie() {
    var msg = $("#freeMsg"), name = CFG.freebieName || "HR Soul resource.pdf";
    msg.textContent = "Getting your download…";
    var get;
    if (CFG.appsScriptUrl && S.code && !PREVIEW) {
      // the current free PDF comes from the Active Document Pool folder in Google Drive
      get = fetch(CFG.appsScriptUrl + "?action=freebie&code=" + encodeURIComponent(S.code)).then(function (r) { return r.json(); }).then(function (j) {
        if (!j.ok) throw new Error(j.message || "missing");
        name = j.name || name;
        var bin = atob(j.data), u = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        return new Blob([u], { type: "application/pdf" });
      });
    } else {
      get = fetch(CFG.freebieUrl).then(function (r) { if (!r.ok) throw new Error("missing"); return r.blob(); });
    }
    get.then(function (b) { return saveFile(b, name); })
      .then(function () { msg.textContent = "Downloaded."; logEvent(S.code, "freebie_downloaded"); })
      .catch(function (e) { msg.textContent = e && e.code === "declined" ? "Download cancelled." : "The free resource isn't available right now."; });
  }

  // ---------- boot ----------
  render();
})();

</script>

</body>
</html>
