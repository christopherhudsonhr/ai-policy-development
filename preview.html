<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>AI Policy Development Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="HR Soul's AI Policy Development tool: build a first draft of your AI policy in about 20 minutes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: Jordan's Snapshot pattern. White header with logo + app name, segmented progress bar, one centered 760px column of cards. */
:root {
  --navy: #1D3A53;
  --blue: #23B0E4;
  --blue-ink: #0E7FAD;         /* AA-contrast blue for text and buttons */
  --bg: #F5F8FA;
  --surface: #FFFFFF;
  --line: #DDE4EA;
  --line-strong: #C3CED7;
  --ink: #1D3A53;
  --ink-2: #4E6273;
  --ink-3: #7A8A97;
  --select-bg: #E4F5FC;
  --select-line: #23B0E4;
  --core-bg: #EEF2F5;
  --adds-bg: #FFF1DE;
  --adds-line: #FFD9A8;
  --adds-ink: #1D3A53;
  --warn-bg: #FFF4E5;
  --warn-ink: #8A4B00;
  --ok: #1E7B34;
  --btn-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(29, 58, 83, .06);
  --font: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --doc-font: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #CFE3F2; --blue: #3BBDEB; --blue-ink: #5CC8EE;
    --bg: #0F1A23; --surface: #16242F; --line: #263846; --line-strong: #345064;
    --ink: #E3EDF4; --ink-2: #A9BBC8; --ink-3: #7F93A2;
    --select-bg: #12384A; --select-line: #3BBDEB; --core-bg: #1B2C38; --adds-bg: #3A2A12; --adds-line: #5C431C; --adds-ink: #F7E6CF;
    --warn-bg: #3A2A12; --warn-ink: #F3C27A; --ok: #6FD08A; --btn-ink: #06202C;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #CFE3F2; --blue: #3BBDEB; --blue-ink: #5CC8EE;
  --bg: #0F1A23; --surface: #16242F; --line: #263846; --line-strong: #345064;
  --ink: #E3EDF4; --ink-2: #A9BBC8; --ink-3: #7F93A2;
  --select-bg: #12384A; --select-line: #3BBDEB; --core-bg: #1B2C38; --adds-bg: #3A2A12; --adds-line: #5C431C; --adds-ink: #F7E6CF;
  --warn-bg: #3A2A12; --warn-ink: #F3C27A; --ok: #6FD08A; --btn-ink: #06202C;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { max-width: 1100px; margin: 0 auto; }
.brand-row { display: flex; align-items: center; gap: 16px; padding-block: 14px 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1 1 auto; }
.brand img { height: 30px; width: auto; display: block; }
.brand img.dark-logo { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand img.light-logo { display: none; } :root:not([data-theme="light"]) .brand img.dark-logo { display: block; } }
:root[data-theme="dark"] .brand img.light-logo { display: none; } :root[data-theme="dark"] .brand img.dark-logo { display: block; }
.brand .app-name { border-left: 1px solid var(--line-strong); padding-left: 14px; color: var(--ink-2); font-weight: 600; font-size: 17px; white-space: nowrap; }
.top-actions { display: flex; align-items: center; gap: 18px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--blue-ink); font-weight: 700; cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }
.pillbtn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.pillbtn:hover { border-color: var(--blue); }
.pillbtn svg { width: 16px; height: 16px; }

.steps { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding-bottom: 10px; list-style: none; margin: 0; padding-left: 0; }
.steps li { min-width: 0; }
.steps .bar { height: 4px; border-radius: 2px; background: var(--line); }
.steps li.done .bar { background: color-mix(in srgb, var(--blue) 55%, var(--surface)); }
.steps li.now .bar { background: var(--blue-ink); }
.steps .lbl { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps li.now .lbl { color: var(--ink); font-weight: 700; }
.steps li.done .lbl { color: var(--ink-2); }

/* page */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.col.wide { max-width: 1100px; }
.eyebrow { font-size: 13px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--blue-ink); }
h1 { font-size: clamp(28px, 4.2vw, 38px); line-height: 1.15; margin: 4px 0 0; color: var(--navy); text-wrap: balance; letter-spacing: -.01em; }
.lede { color: var(--ink-2); margin: 0; max-width: 64ch; font-size: 17px; }
.head { display: flex; flex-direction: column; gap: 6px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 18px; }
.card h2 { font-size: 19px; margin: 0; color: var(--navy); }
.card .sub { margin: -10px 0 0; color: var(--ink-2); font-size: 15px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.grid2 .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .steps .lbl { display: none; } .brand .app-name { font-size: 14px; white-space: normal; } .brand img { height: 24px; } .top-actions { gap: 12px; } }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-weight: 700; font-size: 15px; }
.req { color: #C0392B; margin-left: 2px; }
.opt { color: var(--ink-3); font-weight: 400; font-size: 13px; margin-left: 4px; }
.hint { font-size: 13.5px; color: var(--ink-3); margin: 0; }
input[type=text], input[type=email], input[type=tel], input[type=date], select, textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; background: var(--surface); min-height: 44px; }
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent); }
input.invalid { border-color: #C0392B; }

/* segmented toggle */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: var(--surface); padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed=true] { background: var(--select-bg); color: var(--ink); box-shadow: inset 0 -2px 0 var(--blue); }

.person { display: flex; flex-direction: column; gap: 8px; }
.person-inputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .person-inputs { grid-template-columns: minmax(0, 1fr); } }

/* option rows (Jordan style) */
.q { display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; padding-top: 0; }
.q-title { font-weight: 700; font-size: 16.5px; margin: 0; }
.q-help { margin: -4px 0 0; color: var(--ink-3); font-size: 14px; }
.adds { font-size: 14.5px; color: var(--adds-ink); background: var(--adds-bg); border: 1px solid var(--adds-line); border-radius: 8px; padding: 9px 12px; margin: 0; }
.adds b { color: var(--adds-ink); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 11.5px; margin-right: 8px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opts.row { flex-direction: row; flex-wrap: wrap; }
.opts.row .optrow { flex: 1 1 140px; }
.optrow { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; background: var(--surface); }
.optrow:hover { border-color: var(--line-strong); }
.optrow input { margin: 3px 0 0; accent-color: var(--blue-ink); width: 18px; height: 18px; flex: none; }
.optrow.on { background: var(--select-bg); border-color: var(--select-line); }
.optrow span { min-width: 0; }

/* include list */
.inc { display: flex; flex-direction: column; }
.inc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.inc-row:first-child { border-top: 0; padding-top: 0; }
.inc-row h3 { margin: 0; font-size: 16.5px; }
.inc-row p { margin: 2px 0 0; color: var(--ink-2); font-size: 14.5px; }
.badge { font-size: 12.5px; font-weight: 700; color: var(--ink-2); background: var(--core-bg); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.yn { display: inline-flex; gap: 6px; }
.yn button { min-width: 64px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 700; cursor: pointer; color: var(--ink-2); }
.yn button[aria-pressed=true].yes { background: var(--select-bg); border-color: var(--select-line); color: var(--ink); }
.yn button[aria-pressed=true].no { background: var(--core-bg); border-color: var(--line-strong); color: var(--ink); }
@media (max-width: 520px) { .inc-row { grid-template-columns: minmax(0, 1fr); } }

.estimate { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r); background: var(--select-bg); color: var(--ink); }
.estimate strong { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--navy); }

/* nav */
.nav { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.btn { border-radius: 8px; padding: 11px 22px; font-weight: 700; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); min-height: 46px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--blue-ink); border-color: var(--blue-ink); color: var(--btn-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.nav .msg { color: var(--ink-3); font-size: 14px; flex: 1 1 200px; text-align: right; }

.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: var(--r); padding: 12px 16px; font-size: 15px; margin: 0; }
.subprog { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-2); }
.subprog .track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.subprog .fill { height: 100%; background: var(--blue); border-radius: 3px; transition: width .25s ease; }

/* welcome */
.welcome-hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 760px) { .welcome-hero { grid-template-columns: minmax(0, 1fr); } }
.welcome-hero p { margin: 0 0 12px; color: var(--ink-2); font-size: 17px; max-width: 60ch; }
.facts { display: grid; gap: 12px; }
.fact { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; }
.fact .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--select-bg); display: grid; place-items: center; color: var(--blue-ink); }
.fact .ico svg { width: 22px; height: 22px; }
.fact b { display: block; }
.fact span { color: var(--ink-2); font-size: 14.5px; }
.resume { border-color: var(--select-line); background: var(--select-bg); }
.testing { font-size: 13.5px; color: var(--ink-3); }

/* finish */
.skip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; padding: 16px 0; border-top: 1px solid var(--line); }
.skip:first-child { border-top: 0; padding-top: 0; }
.skip h3 { margin: 0; font-size: 16.5px; }
.skip p { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; }
.skip .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.skip .state { font-size: 13px; font-weight: 700; color: var(--ink-3); }
@media (max-width: 560px) { .skip { grid-template-columns: minmax(0, 1fr); } }

/* review */
.review { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 120px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 160px); overflow: auto; }
.toc .t { font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 700; padding: 4px 8px 8px; }
.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 7px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14.5px; }
.toc a:hover { background: var(--core-bg); }
.toc a .e { color: var(--blue-ink); font-weight: 700; font-size: 13px; }
@media (max-width: 860px) { .review { grid-template-columns: minmax(0, 1fr); } .toc { position: static; max-height: none; } }

/* the document preview: paper stays white in both themes, like a real page */
.paper { background: #FFFFFF; color: #222; border: 1px solid var(--line); border-radius: 6px; padding: clamp(20px, 5vw, 56px); font-family: var(--doc-font); font-size: 14.5px; line-height: 1.55; box-shadow: 0 2px 10px rgba(0,0,0,.08); min-width: 0; overflow-wrap: anywhere; }
.paper .pol-logo { max-height: 56px; max-width: 220px; width: auto; display: block; margin-bottom: 18px; }
.paper .pol-title { color: #222; font-size: 24px; line-height: 1.25; margin: 0 0 16px; letter-spacing: 0; }
.paper .pol-details { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 8px; }
.paper .pol-details th, .paper .pol-details td { border: 1px solid #C9D1D8; padding: 6px 10px; text-align: left; vertical-align: top; }
.paper .pol-details th { background: #F1F4F7; width: 34%; }
.paper .pol-sec { scroll-margin-top: 140px; }
.paper h2 { color: #1D3A53; font-size: 17px; margin: 26px 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.paper p { margin: 0 0 10px; }
.paper ul { margin: 0 0 12px; padding-left: 22px; }
.paper li { margin-bottom: 4px; }
.paper .pol-custom { border-left: 3px solid #23B0E4; padding-left: 10px; }
.paper .pol-edit { font-family: var(--font); font-size: 13px; font-weight: 700; color: #0E7FAD; background: #E4F5FC; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.paper .pol-rev { width: 100%; border-collapse: collapse; font-size: 13px; }
.paper .pol-rev th, .paper .pol-rev td { border: 1px solid #C9D1D8; padding: 6px 8px; text-align: left; }
.paper .pol-rev th { background: #F1F4F7; }
.paper .pol-lines { line-height: 2.2; }
.paper-wrap { min-width: 0; overflow-x: auto; }

/* download */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.summary div { background: var(--core-bg); border-radius: 8px; padding: 12px 14px; }
.summary b { display: block; font-size: 22px; color: var(--navy); font-variant-numeric: tabular-nums; }
.summary span { font-size: 13.5px; color: var(--ink-2); }
@media (max-width: 560px) { .summary { grid-template-columns: minmax(0, 1fr); } }
.status { font-size: 14.5px; color: var(--ink-2); margin: 0; min-height: 1.5em; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10, 22, 32, .55); z-index: 50; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 14px; width: min(860px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal.small { width: min(520px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 19px; color: var(--navy); }
.modal-body { padding: 20px; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
.modal-body p { margin: 0; color: var(--ink-2); }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.x { border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--ink-3); padding: 2px 8px; }
.congrats-top { text-align: left; display: flex; flex-direction: column; gap: 10px; }
.congrats-top .big { font-size: 24px; font-weight: 700; color: var(--navy); line-height: 1.2; }
.offer { border: 1px solid var(--select-line); background: var(--select-bg); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.offer .price { font-size: 28px; font-weight: 700; color: var(--navy); }
.freebie { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* preview mode */
.previewbar { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); background: var(--warn-bg); color: var(--warn-ink); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pv-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding-block: 8px; font-size: 14.5px; }
.pv-tag { font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 12.5px; }
.pv-text { flex: 1 1 240px; min-width: 0; }
.pv-jump { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.pv-jump select { min-height: 36px; padding: 6px 10px; width: auto; max-width: 260px; color: var(--ink); }
.pv-reset { color: var(--warn-ink); }
.stepjump { all: unset; display: block; cursor: pointer; width: 100%; }
.stepjump:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 2px; }
.stepjump:hover .lbl { color: var(--blue-ink); }

/* revision 2: legend, follow-ups, who picker, interval, acknowledgment, progress */
.legend { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.legend summary { cursor: pointer; font-weight: 700; color: var(--blue-ink); }
.legend p { margin: 10px 0 2px; color: var(--ink-2); font-size: 15px; }
.legend strong { color: var(--ink); }
.q.followup { margin-left: 18px; padding-left: 16px; border-left: 3px solid var(--select-line); border-top: 0; padding-top: 4px; }
.who { display: flex; flex-direction: column; gap: 8px; background: var(--core-bg); border-radius: 8px; padding: 12px 14px; }
.who-title { margin: 0; font-weight: 700; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: flex-start; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 14px; max-width: 100%; }
.chip input { margin: 2px 0 0; accent-color: var(--blue-ink); flex: none; }
.chip.on { border-color: var(--select-line); background: var(--select-bg); }
.chip b { display: block; font-weight: 700; }
.chip-sub { display: block; color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
.who-other { max-width: 420px; }
.interval { display: flex; gap: 8px; max-width: 280px; }
.interval input { width: 90px; flex: none; }
input[type=number] { border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; background: var(--surface); min-height: 44px; }
.optrow.ack > span { display: flex; flex-direction: column; gap: 4px; }
.ack-note { color: var(--ink-2); font-size: 14px; }
.ack-text { color: var(--ink); font-size: 14.5px; font-style: italic; }

window.APP_CONTENT = {"version": "0.2", "sections": [{"id": "purpose", "order": 1, "title": "Purpose and Scope", "core": true, "blurb": "Why the policy exists and who it applies to.", "pitch": null, "intro": "This policy explains how {company} employees can use artificial intelligence (AI) tools at work in a way that is safe, ethical, and in line with our values. Our goal is to encourage smart use of AI that improves our work while protecting our people, our customers, and our information.", "items": [{"id": "encourage", "type": "yesno", "prompt": "Should the policy openly encourage employees to use AI?", "help": "Yes sets a supportive tone. No keeps the policy neutral and focused on limits.", "default": true, "text_yes": "{company} supports the use of approved AI tools to work smarter and faster. We would rather employees learn to use AI well than avoid it.", "text_no": "AI use at {company} is allowed only within the limits set out in this policy.", "para": true, "show_if": null, "contact": null}, {"id": "personal_devices", "type": "yesno", "prompt": "Should the policy also cover AI used on personal devices when doing company work?", "help": "Most organizations say Yes. Employees often use AI apps on their own phones for work tasks.", "default": true, "text_yes": "This policy covers AI used on company devices and on personal devices whenever the work involves {company} business or information.", "text_no": null, "para": true, "show_if": null, "contact": null}], "closing": null, "closing_contact": null}, {"id": "definitions", "order": 2, "title": "Definitions", "core": true, "blurb": "Plain-language definitions of key terms so everyone reads the policy the same way.", "pitch": "A Definitions section explains terms like generative AI, prompt, and AI output in plain language, so employees don't have to guess what the policy means. It appears near the front of the policy.", "intro": "These terms are used throughout this policy.", "items": [{"id": "terms", "type": "checklist", "prompt": "Which terms should be defined?", "help": "Check the terms your employees are likely to need. Unchecked terms are left out.", "lead": null, "join": null, "join_empty": null, "show_if": null, "contact_from": null, "options": [{"id": "ai", "text": "**Artificial intelligence (AI):** a computer-based system that generates predictions, recommendations, content, or decisions from data or user inputs.", "default": true}, {"id": "genai", "text": "**Generative AI:** AI that creates new content, such as text, images, audio, video, or code, based on a prompt.", "default": true}, {"id": "prompt", "text": "**Prompt:** the instructions and information you give an AI tool, including typed or pasted text, uploaded files, images, and recordings.", "default": true}, {"id": "output", "text": "**AI output:** anything an AI tool produces, including text, images, code, and summaries.", "default": true}, {"id": "assisted", "text": "**AI-generated or AI-assisted content:** content created or materially changed by AI.", "default": true}, {"id": "public", "text": "**Public AI tool:** an AI tool where the information you enter may be processed or kept by an outside company.", "default": true}, {"id": "approved", "text": "**Approved AI tool:** a tool {it} has approved for specific work uses and types of information. Approval of a tool does not mean every use of it is approved.", "default": true}, {"id": "human_review", "text": "**Human review:** a meaningful check by a qualified person who verifies AI output and stays responsible for decisions made with it.", "default": true}, {"id": "confidential", "text": "**Confidential information:** non-public information about {company}, our employees, customers, or partners.", "default": true}, {"id": "pii", "text": "**Personal information:** information that can identify a person, such as a name, address, or ID number.", "default": true}, {"id": "sensitive", "text": "**Sensitive personal information:** personal information that needs extra protection, such as health, financial, biometric, or government ID information, or other information protected by law.", "default": true}, {"id": "employment", "text": "**Employment decision:** a decision or recommendation about recruiting, screening, hiring, placement, pay, performance, promotion, discipline, or termination.", "default": false}, {"id": "agent", "text": "**AI agent:** an AI tool that can take actions on its own, such as sending messages or updating systems.", "default": false}]}], "closing": null, "closing_contact": null}, {"id": "types", "order": 3, "title": "Types of AI Covered", "core": true, "blurb": "A checklist of the kinds of AI tools and devices the policy covers.", "pitch": null, "intro": "This policy covers any tool that uses AI to create content, make suggestions, analyze information, or take actions.", "items": [{"id": "ai_types", "type": "checklist", "prompt": "Which types of AI should the policy cover?", "help": "When in doubt, leave it checked. Covering a type of AI you don't use yet does no harm.", "lead": "That includes:", "join": null, "join_empty": null, "show_if": null, "contact_from": null, "options": [{"id": "genai_chat", "text": "Generative AI chat tools such as ChatGPT, Claude, Gemini, and Microsoft Copilot", "default": true}, {"id": "genai_embedded", "text": "AI features built into software we already use, such as email, documents, CRM, HR systems, and meeting tools (for example, AI meeting notes and summaries)", "default": true}, {"id": "coding", "text": "AI coding assistants such as GitHub Copilot", "default": true}, {"id": "company_licensed", "text": "AI tools and licenses provided by {company}", "default": true}, {"id": "personal", "text": "AI tools employees buy or sign up for on their own, including free versions, when used for work", "default": true}, {"id": "media", "text": "AI tools that create images, audio, or video", "default": true}, {"id": "agents", "text": "AI agents and automations that can take actions on their own, such as sending messages or updating records", "default": false}, {"id": "browser", "text": "AI browser extensions and plugins", "default": false}, {"id": "glasses", "text": "Smart glasses with cameras, microphones, or AI assistants (such as Meta Ray-Ban glasses)", "default": true}, {"id": "wearables", "text": "Other wearable AI devices, such as AI pins, recording pendants, and smart watches with AI assistants", "default": true}]}, {"id": "other_types", "type": "text", "prompt": "Any other types of AI you want to list? (optional)", "help": "Separate items with commas or put each on its own line. Each one becomes its own bullet.", "template": "{value}", "placeholder": "e.g. AI-powered phone apps, AI translation earbuds", "default": "", "show_if": null, "contact": null, "default_token": null}], "closing": "If you are not sure whether a tool uses AI, ask {contact} before using it for work.", "closing_contact": {"prompt": "Who should employees ask?", "default": ["it"]}}, {"id": "acceptable", "order": 4, "title": "Acceptable Use", "core": true, "blurb": "Examples of how employees are encouraged to use AI.", "pitch": null, "intro": "Employees may use approved AI tools to help with their work, as long as they follow this policy.", "items": [{"id": "uses", "type": "checklist", "prompt": "Which uses should the policy list as acceptable?", "help": "These are examples, not a complete list. Uncheck anything your organization doesn't allow.", "lead": "Good uses of AI include:", "join": null, "join_empty": null, "show_if": null, "contact_from": null, "options": [{"id": "drafting", "text": "Drafting emails, documents, reports, and presentations", "default": true}, {"id": "brainstorm", "text": "Brainstorming ideas and building outlines", "default": true}, {"id": "summarize", "text": "Summarizing long documents, research, or meeting notes", "default": true}, {"id": "research", "text": "Researching topics and explaining unfamiliar subjects", "default": true}, {"id": "data", "text": "Analyzing data and building charts, using only data this policy allows", "default": true}, {"id": "code", "text": "Writing, reviewing, and testing code", "default": true}, {"id": "automation", "text": "Automating repetitive tasks", "default": true}, {"id": "learning", "text": "Learning new skills and preparing for training", "default": true}, {"id": "customer", "text": "Drafting customer-facing content, with human review before it goes out", "default": false}]}, {"id": "other_uses", "type": "text", "prompt": "Any other acceptable uses to list? (optional)", "help": "Separate items with commas or put each on its own line. Each one becomes its own bullet.", "template": "{value}", "placeholder": "e.g. Translating internal documents, Preparing for meetings", "default": "", "show_if": null, "contact": null, "default_token": null}], "closing": "AI should support your work, not replace your judgment. You are responsible for anything you create with AI.", "closing_contact": null}, {"id": "prohibited", "order": 5, "title": "Prohibited Use", "core": true, "blurb": "The uses of AI that are off limits.", "pitch": null, "intro": "Some uses of AI put our people, customers, and company at risk.", "items": [{"id": "not_allowed", "type": "checklist", "prompt": "Which uses should the policy prohibit?", "help": "All of these are checked because they are common risks. Uncheck any that don't fit your organization.", "lead": "Employees may not use AI to:", "join": null, "join_empty": null, "show_if": null, "contact_from": null, "options": [{"id": "confidential", "text": "Enter confidential, proprietary, or personal information into AI tools {company} has not approved for that information", "default": true}, {"id": "decisions", "text": "Make final decisions about people, such as hiring, firing, promotion, pay, or discipline, without human review", "default": true}, {"id": "legal", "text": "Create legal, financial, or compliance documents without review by a qualified person", "default": true}, {"id": "deceive", "text": "Create false, misleading, or deceptive content, including deepfakes", "default": true}, {"id": "impersonate", "text": "Impersonate another person or pass off AI content as written by a specific person", "default": true}, {"id": "harass", "text": "Create content that is discriminatory, harassing, offensive, or against our code of conduct", "default": true}, {"id": "ip", "text": "Copy or reproduce content in a way that violates someone else's copyright or intellectual property", "default": true}, {"id": "security", "text": "Get around security controls, access systems without permission, or create harmful code", "default": true}, {"id": "record", "text": "Record, transcribe, or summarize conversations without the knowledge of the people involved", "default": true}, {"id": "unapproved", "text": "Use AI tools that have not been approved for work, including personal accounts", "default": true}]}, {"id": "other_prohibited", "type": "text", "prompt": "Anything else to prohibit? (optional)", "help": "Separate items with commas or put each on its own line. Each one becomes its own bullet.", "template": "{value}", "placeholder": "e.g. Using AI to write performance reviews", "default": "", "show_if": null, "contact": null, "default_token": null}], "closing": null, "closing_contact": null}, {"id": "privacy", "order": 6, "title": "Data Privacy and Security", "core": true, "blurb": "How to protect company, employee, and customer information when using AI.", "pitch": null, "intro": "Protecting information is the most important part of using AI safely. Anything you type or upload into an AI tool may be stored or used by the company that runs it.", "items": [{"id": "approved_only", "type": "yesno", "prompt": "Should employees only enter company information into approved tools?", "help": null, "default": true, "text_yes": "Only enter company information into AI tools approved by {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who approves AI tools?", "default": ["it"]}}, {"id": "never_enter", "type": "checklist", "prompt": "Which types of information should never go into an unapproved AI tool?", "help": null, "lead": "Never enter the following into an AI tool unless {contact} has approved that tool for that type of information:", "join": null, "join_empty": null, "show_if": null, "contact_from": "approved_only", "options": [{"id": "employee", "text": "Employee personal information, such as Social Security numbers, health information, pay, performance, or home addresses", "default": true}, {"id": "customer", "text": "Customer or client information", "default": true}, {"id": "financial", "text": "Non-public financial information", "default": true}, {"id": "trade", "text": "Trade secrets, product plans, and source code", "default": true}, {"id": "passwords", "text": "Passwords, access keys, or security details", "default": true}, {"id": "legal", "text": "Legal matters and privileged communications", "default": true}]}, {"id": "anonymize", "type": "yesno", "prompt": "Should employees remove identifying details before using AI on sensitive work?", "help": null, "default": true, "text_yes": "When you need AI help with sensitive work, remove names and identifying details first.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "training_off", "type": "yesno", "prompt": "Should employees turn off model training settings when a tool allows it?", "help": "Many AI tools learn from what you type unless this setting is turned off.", "default": true, "text_yes": "Turn off settings that let the AI company use your conversations to train its models, when the tool allows it.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "laws", "type": "checklist", "prompt": "Which privacy laws apply to your organization? (check any that apply)", "help": "Leave these blank if you're not sure. The policy will still say to follow all privacy laws that apply.", "lead": null, "join": "Follow all privacy and data protection laws that apply to {company}, including {list}.", "join_empty": "Follow all privacy and data protection laws that apply to {company}.", "show_if": null, "contact_from": null, "options": [{"id": "hipaa", "text": "HIPAA (health information)", "default": false}, {"id": "state", "text": "State privacy laws such as the California Consumer Privacy Act (CCPA)", "default": false}, {"id": "gdpr", "text": "GDPR (personal data of people in the EU and UK)", "default": false}, {"id": "glba", "text": "GLBA (financial customer information)", "default": false}, {"id": "ferpa", "text": "FERPA (student records)", "default": false}, {"id": "pci", "text": "PCI DSS (payment card data)", "default": false}]}, {"id": "other_laws", "type": "textlist", "prompt": "Any other privacy laws that apply? (optional)", "help": "Separate laws with commas or put each on its own line. They print as a list at the end of this section.", "lead": "The following additional privacy laws apply to our organization:", "placeholder": "e.g. Colorado Privacy Act, Texas Data Privacy and Security Act", "show_if": null, "at_end": true}, {"id": "existing", "type": "yesno", "prompt": "Should the policy point to your existing security and data policies?", "help": null, "default": true, "text_yes": "Follow our existing information security and data handling policies when using AI.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "report_exposure", "type": "yesno", "prompt": "Should employees report information entered by mistake?", "help": null, "default": true, "text_yes": "If you think confidential information was entered into an AI tool by mistake, tell {contact} right away.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who should employees tell?", "default": ["it"]}}], "closing": null, "closing_contact": null}, {"id": "oversight", "order": 7, "title": "Human Oversight and Accountability", "core": true, "blurb": "Keeps people responsible for AI-assisted work and decisions.", "pitch": null, "intro": "AI can be wrong, biased, or out of date, even when it sounds confident. People stay responsible for the work.", "items": [{"id": "own_work", "type": "yesno", "prompt": "Should employees be responsible for all work they create with AI?", "help": null, "default": true, "text_yes": "You are responsible for all work you produce with the help of AI, just as if you created it yourself.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "review", "type": "yesno", "prompt": "Should AI output be reviewed before it's used or shared?", "help": null, "default": true, "text_yes": "Review AI output for accuracy, quality, and tone before you use or share it.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "facts", "type": "yesno", "prompt": "Should employees check facts and sources?", "help": null, "default": true, "text_yes": "Check facts, numbers, quotes, and sources against a trusted source.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "final_call", "type": "yesno", "prompt": "Should a person make the final call on important decisions?", "help": null, "default": true, "text_yes": "A person must make the final call on decisions that affect people, customers, money, or safety.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "signoff", "type": "yesno", "prompt": "Should AI-assisted work going outside the company need a second reviewer?", "help": "Useful for client deliverables or regulated content. Many organizations leave this as No.", "default": false, "text_yes": "AI-assisted work that goes outside the company must be reviewed by {contact} first.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who should review it?", "default": ["manager"]}}], "closing": null, "closing_contact": null}, {"id": "support", "order": 8, "title": "Questions and Support", "core": true, "blurb": "Who employees go to with questions.", "pitch": null, "intro": "We want employees to feel comfortable asking questions about AI. No question is too basic.", "items": [{"id": "owner_contact", "type": "yesno", "prompt": "Should employees contact someone with questions about this policy?", "help": null, "default": true, "text_yes": "For questions about appropriate use, approved tools, or this policy, contact {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who should they contact?", "default": ["owner"]}}, {"id": "hr_q", "type": "yesno", "prompt": "Should employees have someone to talk to about how AI affects their jobs?", "help": null, "default": true, "text_yes": "For questions about how AI affects your job or your team, talk to {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who should they talk to?", "default": ["manager", "hr"]}}, {"id": "it_q", "type": "yesno", "prompt": "Should employees have someone to contact for technical or security help?", "help": null, "default": true, "text_yes": "For technical help or security concerns, contact {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who should they contact?", "default": ["it"]}}, {"id": "resources", "type": "text", "prompt": "Where can employees find AI resources? (optional)", "help": null, "template": "You can also find AI resources and updates at {value}.", "placeholder": "e.g. the AI page on our intranet", "default": "", "show_if": null, "contact": null, "default_token": null}], "closing": null, "closing_contact": null}, {"id": "tools", "order": 9, "title": "Approved Tools and New Tool Requests", "core": false, "blurb": "Lists the AI tools employees may use and explains how to ask for a new one.", "pitch": "An Approved Tools section names the AI tools employees can use and explains how to request a new one. Without it, employees tend to guess or use personal accounts.", "intro": "{company} keeps a list of AI tools approved for work use. Using approved tools helps protect our information and makes sure the right agreements are in place.", "items": [{"id": "approved_list", "type": "text", "prompt": "List your approved AI tools, separated by commas (optional)", "help": null, "template": "Approved tools currently include: {value}.", "placeholder": "e.g. Microsoft Copilot, ChatGPT Enterprise", "default": "", "show_if": null, "contact": null, "default_token": null}, {"id": "list_location", "type": "text", "prompt": "Where will the up-to-date list of approved tools live? (optional)", "help": null, "template": "The current list of approved tools is kept at {value}.", "placeholder": "e.g. the IT page on our intranet", "default": "", "show_if": null, "contact": null, "default_token": null}, {"id": "request", "type": "yesno", "prompt": "Should employees submit a request before using a new AI tool?", "help": null, "default": true, "text_yes": "To use a new AI tool, or an approved tool in a new way, submit a request to {contact} first.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Where do requests go?", "default": ["it"]}}, {"id": "form", "type": "yesno", "prompt": "Do you have an AI use request form employees need to complete?", "help": null, "default": false, "text_yes": "Employees must complete an AI use request form before using a new AI tool or using an approved tool in a new way.", "text_no": null, "para": false, "show_if": "request", "contact": null}, {"id": "form_location", "type": "text", "prompt": "Where does that form live?", "help": null, "template": "The form is found at {value}.", "placeholder": "e.g. the HR portal under Forms", "default": "", "show_if": "form", "contact": null, "default_token": null}, {"id": "form_instructions", "type": "yesno", "prompt": "Does the form include instructions for submitting it?", "help": null, "default": true, "text_yes": "Follow the instructions on the form when you submit it.", "text_no": null, "para": false, "show_if": "form", "contact": null}, {"id": "request_details", "type": "yesno", "prompt": "Should requests explain the purpose, data, and cost?", "help": null, "default": true, "text_yes": "Requests should explain how the tool will be used, the expected benefit, what information will go into it, and any cost.", "text_no": null, "para": false, "show_if": "request", "contact": null}, {"id": "response_time", "type": "text", "prompt": "How quickly will requests get a response? (optional)", "help": null, "template": "Requests will get a response within {value}.", "placeholder": "e.g. 5 business days", "default": "", "show_if": "request", "contact": null, "default_token": null}, {"id": "wait", "type": "yesno", "prompt": "Should employees wait for approval before using a new tool?", "help": null, "default": true, "text_yes": "Don't use a new tool for work until it has been approved.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "free_versions", "type": "yesno", "prompt": "Should free or personal versions of approved tools be off limits?", "help": "For example, a personal ChatGPT account is different from a company ChatGPT Enterprise license.", "default": true, "text_yes": "Free or personal versions of approved tools are not approved unless {contact} says otherwise.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who can make an exception?", "default": ["it"]}}], "closing": null, "closing_contact": null}, {"id": "ownership", "order": 10, "title": "Ownership and Intellectual Property", "core": false, "blurb": "Makes clear that work created with AI belongs to the company and helps avoid copyright problems.", "pitch": "An Ownership section makes clear that work created with AI on the job belongs to the company and helps avoid copyright problems.", "intro": "Work you create with the help of AI as part of your job belongs to {company}, the same as any other work product.", "items": [{"id": "no_personal", "type": "yesno", "prompt": "Should employees be barred from claiming personal ownership of AI-assisted work?", "help": null, "default": true, "text_yes": "Employees may not claim personal ownership of AI-assisted work created for {company}.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "terms", "type": "yesno", "prompt": "Should employees check a tool's terms of use?", "help": null, "default": true, "text_yes": "Check that an AI tool's terms of use don't give the vendor rights to our content or conflict with our confidentiality obligations. When in doubt, ask {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who should they ask when in doubt?", "default": ["legal"]}}, {"id": "third_party", "type": "yesno", "prompt": "Should copying or rewriting outside content with AI be restricted?", "help": null, "default": true, "text_yes": "Don't use AI to copy or rewrite content from clients, competitors, or other outside sources unless you have permission. When in doubt, ask {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who should they ask when in doubt?", "default": ["manager"]}}, {"id": "store", "type": "yesno", "prompt": "Should AI-assisted work be stored only in company systems?", "help": null, "default": true, "text_yes": "Treat AI-assisted work as confidential unless it is meant to be shared, and store it only in approved company systems.", "text_no": null, "para": false, "show_if": null, "contact": null}], "closing": null, "closing_contact": null}, {"id": "transparency", "order": 11, "title": "Transparency and Disclosure", "core": false, "blurb": "Explains when employees should tell others that AI helped create their work.", "pitch": "A Transparency section explains when employees should tell others that AI helped create their work. It builds trust with customers and coworkers.", "intro": "Being open about AI use builds trust with our customers, partners, and each other.", "items": [{"id": "external", "type": "yesno", "prompt": "Should customers be told when AI wrote most of the content they receive?", "help": "Light help, like fixing grammar or tightening a sentence, doesn't count.", "default": true, "text_yes": "Tell customers or partners when AI wrote most of the content they receive, such as a report or message a person only lightly edited, and they would reasonably expect to know.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "chatbots", "type": "yesno", "prompt": "Should AI tools that talk to customers or candidates identify themselves as AI?", "help": null, "default": true, "text_yes": "Any AI tool that talks directly with customers or candidates must say that it is AI.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "meetings", "type": "yesno", "prompt": "Should people be told when an AI note-taker is in a meeting?", "help": null, "default": true, "text_yes": "Let people know at the start of a meeting when an AI note-taker or recording tool is being used.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "no_misrepresent", "type": "yesno", "prompt": "Should employees be honest when asked how work was created?", "help": null, "default": true, "text_yes": "Never present AI-generated work as entirely your own when you are asked how it was created.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "internal", "type": "yesno", "prompt": "Should employees tell their manager when AI did most of the work on a deliverable?", "help": "This is about deliverables where AI produced most of the content, not everyday help like summaries or edits.", "default": false, "text_yes": "Let your manager know when AI did most of the work on a deliverable, such as drafting most of a report or analysis.", "text_no": null, "para": false, "show_if": null, "contact": null}], "closing": null, "closing_contact": null}, {"id": "ethics", "order": 12, "title": "Ethics, Bias, and Fairness", "core": false, "blurb": "Sets expectations for fair, respectful AI use and watching for biased results.", "pitch": "An Ethics section sets expectations for fair, respectful AI use and asks employees to watch for biased results.", "intro": "All AI use must reflect {company}'s values. AI can repeat or amplify bias from the information it learned from, so we ask everyone to stay alert.", "items": [{"id": "bias", "type": "yesno", "prompt": "Should employees watch AI output for bias?", "help": null, "default": true, "text_yes": "Watch AI output for bias, stereotypes, or unfair treatment of any group, and fix it before using it.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "report_harm", "type": "yesno", "prompt": "Should employees report harmful or biased output?", "help": null, "default": true, "text_yes": "Report harmful, biased, or offensive AI output to {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who should they report it to?", "default": ["it", "hr"]}}, {"id": "values", "type": "yesno", "prompt": "Should AI use be tied to your code of conduct?", "help": null, "default": true, "text_yes": "Don't use AI in ways that conflict with our code of conduct or harm the trust people place in us.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "accessibility", "type": "yesno", "prompt": "Should the policy support AI tools used as accommodations?", "help": null, "default": true, "text_yes": "AI tools that help employees with disabilities do their work are welcome. Requests go through our normal accommodation process with {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who handles accommodation requests?", "default": ["hr"]}}], "closing": null, "closing_contact": null}, {"id": "employment", "order": 13, "title": "AI in Employment Decisions", "core": false, "blurb": "Covers AI used in hiring, performance reviews, pay, and other decisions about people.", "pitch": "An Employment Decisions section covers AI in hiring, performance reviews, and pay. A growing number of states and cities regulate this, so it's worth a close look.", "intro": "Decisions about people deserve extra care. These rules apply whenever AI is used in hiring, performance, pay, promotion, discipline, or termination.", "items": [{"id": "human_decides", "type": "yesno", "prompt": "Should a person always make the final decision about people?", "help": null, "default": true, "text_yes": "AI may support, but never make, decisions about hiring, promotion, pay, discipline, or termination. A person makes the final decision.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "hr_approval", "type": "yesno", "prompt": "Should any AI used to screen or evaluate people be approved first?", "help": null, "default": true, "text_yes": "Any AI tool used to screen, rank, or evaluate candidates or employees must be approved by {contact} before use.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who approves these tools?", "default": ["hr"]}}, {"id": "bias_testing", "type": "yesno", "prompt": "Should these tools be checked for bias?", "help": "If a vendor does the testing, choose Someone else and type the vendor's name or role.", "default": true, "text_yes": "AI tools used in employment decisions will be reviewed for bias by {contact} before use and checked regularly after that.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who will review them for bias?", "default": ["hr"]}}, {"id": "notice", "type": "yesno", "prompt": "Should candidates and employees be told when AI affects decisions about them?", "help": null, "default": true, "text_yes": "Candidates and employees will be told when AI is used in a way that affects decisions about them, as required by law.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "laws", "type": "yesno", "prompt": "Should the policy commit to following employment laws on AI?", "help": null, "default": true, "text_yes": "We will follow all employment laws that apply to AI, including equal employment opportunity laws and state or local rules on automated hiring tools.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "reviews", "type": "yesno", "prompt": "Can managers use AI to help draft performance reviews?", "help": null, "default": true, "text_yes": "Managers may use AI to help draft performance reviews, but the content must reflect the manager's own assessment.", "text_no": "Managers may not use AI to write performance reviews.", "para": false, "show_if": null, "contact": null}, {"id": "monitoring", "type": "yesno", "prompt": "Does your organization use AI to monitor employee work?", "help": "For example, tools that track productivity, keystrokes, or behavior.", "default": false, "text_yes": null, "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "monitoring_notice", "type": "yesno", "prompt": "Will employees be told before AI is used to monitor their work?", "help": null, "default": true, "text_yes": "{company} may use AI tools to monitor employee productivity or behavior. Employees will be told before this happens and how the information will be used.", "text_no": "{company} may use AI tools to monitor employee productivity or behavior.", "para": false, "show_if": "monitoring", "contact": null}], "closing": null, "closing_contact": null}, {"id": "wearables", "order": 14, "title": "Wearables, Smart Glasses, and Recording", "core": false, "blurb": "Sets rules for smart glasses and other wearables that can record or use AI at work.", "pitch": "Smart glasses and other wearables can quietly record audio, photos, and video. A Wearables section sets clear rules for when they can be used at work.", "intro": "Smart glasses and other wearable devices can look like ordinary items while recording audio, photos, or video and sending information to AI services. These rules protect the privacy of our coworkers, customers, and visitors.", "items": [{"id": "allowed", "type": "yesno", "prompt": "Are smart glasses and AI wearables allowed at work, with rules?", "help": null, "default": true, "text_yes": "Wearable AI devices may be used at work only as described in this section.", "text_no": "Wearable AI devices with cameras or microphones may not be worn at work without approval from {contact}.", "para": false, "show_if": null, "contact": {"prompt": "Who can approve an exception?", "default": ["it"]}}, {"id": "consent", "type": "yesno", "prompt": "Should recording people require their knowledge and consent?", "help": null, "default": true, "text_yes": "Never record, photograph, or transcribe people without their knowledge and consent.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "areas", "type": "yesno", "prompt": "Should recording devices be turned off in private or restricted areas?", "help": null, "default": true, "text_yes": "Turn off or remove recording devices in restrooms, break rooms, client conversations, and any area marked as restricted.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "confidential", "type": "yesno", "prompt": "Should recording devices be banned in confidential meetings?", "help": null, "default": true, "text_yes": "Don't wear recording devices in meetings where confidential, HR, or customer information is discussed.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "indicator", "type": "yesno", "prompt": "Should devices have to show a light or signal when recording?", "help": null, "default": true, "text_yes": "Only use devices that show a visible light or signal when recording.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "accommodation", "type": "yesno", "prompt": "Should employees be able to request a wearable as an accommodation?", "help": null, "default": true, "text_yes": "Employees who need a wearable device for a disability or medical reason can request an accommodation through {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who handles these requests?", "default": ["hr"]}}, {"id": "accommodation_policy", "type": "yesno", "prompt": "Should employees refer to your accommodation or leave policy for more information?", "help": null, "default": false, "text_yes": "See our accommodation and leave policy for more information.", "text_no": null, "para": false, "show_if": "accommodation", "contact": null}, {"id": "accommodation_policy_location", "type": "text", "prompt": "Where is that policy kept? (optional)", "help": null, "template": "It is kept at {value}.", "placeholder": "e.g. the employee handbook", "default": "", "show_if": "accommodation_policy", "contact": null, "default_token": null}, {"id": "ask_remove", "type": "yesno", "prompt": "Can anyone ask a coworker to stop recording?", "help": null, "default": true, "text_yes": "Anyone may ask a coworker to stop recording or remove a device. Concerns can be raised with {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who can concerns be raised with?", "default": ["manager", "hr"]}}, {"id": "never_areas", "type": "text", "prompt": "Any places where wearables are never allowed? (optional)", "help": null, "template": "Wearable AI devices are never allowed in: {value}.", "placeholder": "e.g. the lab, patient rooms", "default": "", "show_if": null, "contact": null, "default_token": null}], "closing": null, "closing_contact": null}, {"id": "training", "order": 15, "title": "Training and Enablement", "core": false, "blurb": "Describes the AI training the company provides and whether it's required.", "pitch": "A Training section explains what AI training the company provides. People follow policies they understand.", "intro": "{company} wants every employee to feel confident using AI.", "items": [{"id": "provides", "type": "yesno", "prompt": "Does your organization provide training on AI tools?", "help": "If you answer No, the policy includes a short general statement instead of the questions below.", "default": true, "text_yes": "We provide training to help employees use approved tools well and responsibly.", "text_no": "From time to time, {company} may offer training on AI tools. {contact} will share details when training is available.", "para": false, "show_if": null, "contact": {"prompt": "Who will share training details?", "default": ["hr"]}}, {"id": "topics", "type": "checklist", "prompt": "What does training cover?", "help": null, "lead": "Training covers:", "join": null, "join_empty": null, "show_if": "provides", "contact_from": null, "options": [{"id": "literacy", "text": "Basic AI skills: what AI can and can't do", "default": true}, {"id": "tools", "text": "How to use our approved AI tools", "default": true}, {"id": "data", "text": "Protecting data and privacy when using AI", "default": true}, {"id": "bias", "text": "Spotting bias and inaccurate output", "default": true}, {"id": "prompting", "text": "Writing good prompts", "default": false}, {"id": "reporting", "text": "How to report problems or concerns", "default": false}]}, {"id": "required", "type": "yesno", "prompt": "Is AI training required before using company AI tools?", "help": null, "default": true, "text_yes": "AI training is required before using company AI tools.", "text_no": "AI training is available to all employees and strongly encouraged.", "para": false, "show_if": "provides", "contact": null}, {"id": "refresh", "type": "yesno", "prompt": "Should training be refreshed at regular intervals?", "help": null, "default": true, "text_yes": null, "text_no": null, "para": false, "show_if": "provides", "contact": null}, {"id": "refresh_interval", "type": "select", "prompt": "How often?", "help": null, "template": "Training will be refreshed {value}, or sooner when tools or rules change.", "options": ["every 6 months", "once a year", "every 2 years"], "default": "once a year", "other": true, "show_if": "refresh", "contact": null}, {"id": "onboarding", "type": "yesno", "prompt": "Should new employees review this policy during onboarding?", "help": null, "default": true, "text_yes": null, "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "onboarding_ack", "type": "yesno", "prompt": "Should they also acknowledge that they received it?", "help": "Acknowledging means signing the sign-off page at the end of this policy.", "default": true, "text_yes": "New employees will review and acknowledge that they have received this policy during onboarding.", "text_no": "New employees will receive this policy as part of onboarding.", "para": false, "show_if": "onboarding", "contact": null}], "closing": null, "closing_contact": null}, {"id": "vendors", "order": 16, "title": "Third-Party AI Vendors", "core": false, "blurb": "Sets standards for outside companies whose AI tools touch your data.", "pitch": "A Third-Party Vendors section sets minimum standards for outside companies whose AI tools touch your data.", "intro": "Many AI tools come from outside vendors. Before {company} buys or approves a vendor's AI tool, it will be reviewed to make sure it protects our information.", "items": [{"id": "security_review", "type": "yesno", "prompt": "Should vendor security and privacy practices be reviewed before approval?", "help": null, "default": true, "text_yes": "{contact} will review each vendor's security and privacy practices before approval.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who will review them?", "default": ["it"]}}, {"id": "contract", "type": "yesno", "prompt": "Should contracts limit how vendors use your data?", "help": null, "default": true, "text_yes": "Vendor contracts will spell out how our data is used, stored, and deleted, and will not let the vendor train its AI on our data without permission.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "disclose", "type": "yesno", "prompt": "Should vendors and contractors tell you when they use AI on your work?", "help": null, "default": true, "text_yes": "Vendors and contractors who use AI in work they do for us must tell us and follow this policy.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "certs", "type": "yesno", "prompt": "Should vendors handling sensitive data hold security certifications?", "help": null, "default": false, "text_yes": "Vendors handling sensitive data should hold recognized security certifications, such as SOC 2 or ISO 27001.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "other_certs", "type": "text", "prompt": "Besides SOC 2 and ISO 27001, any other certifications to include? (optional)", "help": null, "template": "Other accepted certifications include {value}.", "placeholder": "e.g. HITRUST, FedRAMP", "default": "", "show_if": "certs", "contact": null, "default_token": null}, {"id": "register", "type": "yesno", "prompt": "Should you keep a list of AI vendors and review it yearly?", "help": null, "default": false, "text_yes": "{contact} will keep a list of AI vendors and review it at least once a year.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who is responsible for the list?", "default": ["it"]}}, {"id": "register_location", "type": "text", "prompt": "Where will the list be kept? (optional)", "help": null, "template": "The list is kept at {value}.", "placeholder": "e.g. the vendor management system", "default": "", "show_if": "register", "contact": null, "default_token": null}], "closing": null, "closing_contact": null}, {"id": "incidents", "order": 17, "title": "Incident Reporting and Response", "core": false, "blurb": "Explains what to do when AI goes wrong: data shared by mistake, harmful output, or a tool failure.", "pitch": "An Incident Response section tells employees exactly what to do when something goes wrong, like data shared by mistake, a harmful output, or a tool failure.", "intro": "Mistakes happen. Reporting them quickly helps us fix problems before they grow. Nobody will be penalized for reporting an honest mistake.", "items": [{"id": "report_what", "type": "checklist", "prompt": "What should employees report?", "help": null, "lead": "Report these right away:", "join": null, "join_empty": null, "show_if": null, "contact_from": null, "options": [{"id": "data", "text": "Confidential or personal information entered into an AI tool by mistake", "default": true}, {"id": "harmful", "text": "Harmful, biased, or offensive AI output", "default": true}, {"id": "failure", "text": "An AI tool that stops working, gives wrong results, or behaves unexpectedly", "default": true}, {"id": "unapproved", "text": "Use of AI tools that haven't been approved", "default": true}, {"id": "security", "text": "Suspected security breaches involving AI", "default": true}]}, {"id": "timeframe", "type": "select", "prompt": "How quickly should incidents be reported?", "help": "If you don't have a set timeframe yet, 24 hours is a common starting point.", "template": "Report incidents to {contact} within {value}.", "options": ["12 hours", "24 hours", "36 hours", "48 hours"], "default": "24 hours", "other": true, "show_if": null, "contact": {"prompt": "Who should incidents be reported to?", "default": ["it"]}}, {"id": "stop", "type": "yesno", "prompt": "Should employees stop using a tool that may have caused harm?", "help": null, "default": true, "text_yes": "If an AI tool may have caused harm or exposed data, stop using it until {contact} says it is safe.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who decides it's safe again?", "default": ["it"]}}, {"id": "preserve", "type": "yesno", "prompt": "Should employees keep a record of what happened?", "help": null, "default": true, "text_yes": "Keep a record of what happened, such as screenshots, prompts, and outputs, to help with the review.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "followup", "type": "yesno", "prompt": "Should someone investigate each report and share lessons learned?", "help": null, "default": true, "text_yes": "{contact} will look into each report, bring in others as needed, and share lessons learned so it doesn't happen again.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who investigates?", "default": ["it"]}}, {"id": "anonymous", "type": "yesno", "prompt": "Can employees report concerns anonymously?", "help": null, "default": false, "text_yes": "Employees can also report concerns anonymously through {contact}.", "text_no": null, "para": false, "show_if": null, "contact": {"prompt": "Who receives anonymous reports?", "default": ["hr"]}}], "closing": null, "closing_contact": null}, {"id": "governance", "order": 18, "title": "Governance and Roles", "core": false, "blurb": "Names who owns AI decisions, whether that's one person, an employee council, or a governance group.", "pitch": "A Governance section names who owns AI decisions. In a small organization that may be one person. In a larger one it's often a group. Without clear owners, questions and tool requests stall.", "intro": "Clear ownership keeps AI decisions consistent and moving.", "items": [{"id": "gov_type", "type": "select", "prompt": "Who owns AI governance at your organization?", "help": "Pick the closest fit. The name comes from the AI governance group contact on Policy Details.", "template": null, "options": ["An AI governance group or committee", "An employee AI council", "A single person", "Not assigned yet"], "default": "An AI governance group or committee", "other": false, "show_if": null, "contact": null, "option_text": {"An AI governance group or committee": "{gov} oversees how AI is used at {company}.", "An employee AI council": "{gov} oversees how AI is used at {company}.", "A single person": "{gov} oversees how AI is used at {company}.", "Not assigned yet": "{company} has not yet assigned responsibility for AI governance. Until it does, questions about AI use go to {owner}."}}, {"id": "duties", "type": "checklist", "prompt": "What are they responsible for?", "help": null, "lead": "{gov} is responsible for:", "join": null, "join_empty": null, "show_if": {"q": "gov_type", "in": ["An AI governance group or committee", "An employee AI council", "A single person"]}, "contact_from": null, "options": [{"id": "approve", "text": "Reviewing and approving AI tools and new uses of AI", "default": true}, {"id": "list", "text": "Keeping the approved tools list up to date", "default": true}, {"id": "risk", "text": "Assessing the risks of new AI uses, especially those involving sensitive data or decisions about people", "default": true}, {"id": "monitor", "text": "Tracking how AI is being used and whether this policy is working", "default": true}, {"id": "updates", "text": "Recommending updates to this policy", "default": true}, {"id": "training", "text": "Guiding AI training and best practices", "default": false}]}, {"id": "members", "type": "checklist", "prompt": "Who is part of the group?", "help": null, "lead": "The group includes:", "join": null, "join_empty": null, "show_if": {"q": "gov_type", "in": ["An AI governance group or committee", "An employee AI council"]}, "contact_from": null, "options": [{"id": "employees", "text": "Employees from across the business", "default": true}, {"id": "managers", "text": "Managers", "default": true}, {"id": "executives", "text": "Executives", "default": false}, {"id": "hr", "text": "HR", "default": true}, {"id": "it", "text": "IT and security", "default": true}, {"id": "legal", "text": "Legal or compliance", "default": false}]}, {"id": "cadence", "type": "yesno", "prompt": "Has the group set a regular meeting schedule?", "help": null, "default": true, "text_yes": null, "text_no": null, "para": false, "show_if": {"q": "gov_type", "in": ["An AI governance group or committee", "An employee AI council"]}, "contact": null}, {"id": "meets", "type": "select", "prompt": "How often does it meet?", "help": null, "template": "{gov} meets {value}.", "options": ["weekly", "every two weeks", "monthly", "quarterly"], "default": "monthly", "other": true, "show_if": "cadence", "contact": null}, {"id": "charter", "type": "yesno", "prompt": "Does the group have a published charter?", "help": null, "default": false, "text_yes": "The group's charter describes its purpose and how it works.", "text_no": null, "para": false, "show_if": {"q": "gov_type", "in": ["An AI governance group or committee", "An employee AI council"]}, "contact": null}, {"id": "charter_location", "type": "text", "prompt": "Where is the charter published? (optional)", "help": null, "template": "It is published at {value}.", "placeholder": "e.g. the AI page on our intranet", "default": "", "show_if": "charter", "contact": null, "default_token": null}, {"id": "dept_owner", "type": "yesno", "prompt": "Should the policy name the department or departments that enforce it?", "help": null, "default": true, "text_yes": null, "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "enforcer", "type": "depts", "prompt": "Which departments enforce it?", "help": "Starts with the departments you picked on Policy Details. Change them here if this section should say something different.", "template_one": "{value} is responsible for carrying out and enforcing this policy.", "template_many": "{value} are jointly responsible for carrying out and enforcing this policy.", "show_if": "dept_owner"}], "closing": null, "closing_contact": null}, {"id": "enforcement", "order": 19, "title": "Misuse and Enforcement", "core": false, "blurb": "Explains what happens when someone breaks the policy.", "pitch": "A Misuse and Enforcement section explains what happens when someone breaks the policy, so expectations are clear and applied fairly.", "intro": "We expect everyone to follow this policy. Breaking it can put our people, customers, and company at risk.", "items": [{"id": "discipline", "type": "yesno", "prompt": "Can misuse lead to disciplinary action?", "help": null, "default": true, "text_yes": "Misuse of AI may lead to disciplinary action, up to and including termination, in line with our existing policies.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "access", "type": "yesno", "prompt": "Can the company remove AI tool access?", "help": null, "default": true, "text_yes": "{company} may remove access to AI tools when this policy isn't followed.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "monitor", "type": "yesno", "prompt": "Can the company review the use of company AI tools and accounts?", "help": null, "default": true, "text_yes": "{company} may review the use of company AI tools and accounts to make sure this policy is followed.", "text_no": null, "para": false, "show_if": null, "contact": null}, {"id": "retaliation", "type": "yesno", "prompt": "Should the policy promise no retaliation for good-faith reports?", "help": null, "default": true, "text_yes": "{company} will not retaliate against anyone who reports a concern in good faith.", "text_no": null, "para": false, "show_if": null, "contact": null}], "closing": null, "closing_contact": null}, {"id": "review", "order": 20, "title": "Policy Review and Updates", "core": false, "blurb": "Sets how often the policy will be reviewed as AI tools and laws change.", "pitch": "A Review and Updates section commits to revisiting the policy as AI changes, and AI changes quickly.", "intro": "AI technology and laws change quickly, so this policy will change too.", "items": [{"id": "frequency", "type": "interval", "prompt": "How often will the policy be reviewed?", "help": "Every 6 months is common while AI is changing quickly.", "template"
